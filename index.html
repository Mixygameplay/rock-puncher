<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rock Puncher</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ece8dc; --ink: #2a2d2f; --muted: #6b6f70; --accent: #b5651d; --panel: #f6f3ea; --line: #cfc8b6;
    --font: "Bitter", Georgia, serif;
    --game-w: min(100%, calc((100vh - 150px) * 2));   /* fill the window width, but keep the whole game on screen */
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1d2123; --ink: #e6e2d6; --muted: #9a9e9f; --accent: #e0a458; --panel: #2a2f32; --line: #3c4144; }
  }
  :root[data-theme="dark"] { --bg: #1d2123; --ink: #e6e2d6; --muted: #9a9e9f; --accent: #e0a458; --panel: #2a2f32; --line: #3c4144; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .6rem; padding: 0 .5rem; user-select: none; -webkit-user-select: none;
  }
  .hud { width: var(--game-w); display: flex; justify-content: space-between; align-items: baseline; font-size: 1.5rem; font-weight: 800; }
  .hud small { font-size: .95rem; font-weight: 500; color: var(--muted); }
  .full { color: var(--accent); font-size: .9rem; margin-left: .4rem; }
  .full[hidden] { display: none; }
  #hint { color: var(--muted); margin: 0; font-size: .95rem; text-align: center; min-height: 1.3em; }
  canvas { width: 100%; height: auto; border-radius: 10px; display: block; }
  canvas.clickable { cursor: pointer; }
  .stage { position: relative; width: var(--game-w); }
  .panel {
    position: absolute; left: 12px; top: 12px; width: min(240px, 58%);
    background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: .7rem .8rem;
  }
  .panel[hidden], .leave-btn[hidden] { display: none; }
  .panel h2 { margin: 0 0 .15rem; font-size: 1rem; }
  .panel p { margin: 0 0 .5rem; font-size: .85rem; color: var(--muted); }
  .panel button {
    width: 100%; font: inherit; font-weight: 800; padding: .5rem; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--accent); background: var(--accent); color: var(--panel);
  }
  .panel button:disabled { background: transparent; color: var(--muted); border-color: var(--line); cursor: default; }
  .leave-btn {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: inherit; font-weight: 800; padding: .55rem 1.4rem; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .leave-btn:hover { border-color: var(--accent); }
  .reset-btn { font: inherit; font-size: .8rem; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: .2rem; }
  .reset-btn:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="hud">
  <div>Stones <span id="bagCount">0</span><small> / <span id="bagCap">10</span></small><span class="full" id="bagFull" hidden>FULL</span></div>
  <div id="money">$0</div>
</div>
<div class="stage">
  <canvas id="game" width="1000" height="500" aria-label="Rock Puncher game"></canvas>
  <!-- Shop window: only visible after you click the shop -->
  <div class="panel" id="shopPanel" hidden>
    <h2>Tough Fists</h2>
    <p>Each punch deals 2 damage instead of 1.</p>
    <button id="buyBtn"></button>
  </div>
  <button class="leave-btn" id="leaveBtn" hidden>Leave shop</button>
</div>
<p id="hint"></p>
<button class="reset-btn" id="resetBtn">Reset progress</button>

<script>
  // ---------- Settings (change these to tweak the game) ----------
  const STONE_HEALTH = 5;       // damage needed to break off 1 stone
  const STONE_VALUE = 1;        // dollars you get for each stone sold at the crusher
  const SELL_TIME = 1;          // seconds you must hold the click on the crusher to sell
  const UPGRADE_COST = 25;      // price of Tough Fists, in dollars
  const INVENTORY_BASE = 10;    // how many stones you can carry to start
  const WALK_SPEED = 220;       // pixels per second
  const SHOP_X = 300;           // where each building / the rock is
  const CRUSHER_X = 640;
  const ROCK_X = 900;
  const MAX_GROUND = 64;        // most stones that can lie on the ground at once

  // The ground is a line that steps up from left to right. Each pair is [x, height of the ground at x].
  // groundAt(x) blends smoothly between neighbors, so everything (you, buildings, stones) can ask "how high is the ground here?"
  const TERRAIN = [[0, 500], [120, 497], [225, 415], [510, 413], [590, 347], [700, 345], [1000, 323]];
  function groundAt(x) {
    x = Math.max(0, Math.min(1000, x));
    for (let i = 0; i < TERRAIN.length - 1; i++) {
      const [x0, y0] = TERRAIN[i], [x1, y1] = TERRAIN[i + 1];
      if (x <= x1) { const t = (x - x0) / (x1 - x0); return y0 + (y1 - y0) * t * t * (3 - 2 * t); }   // smooth S-curve step
    }
    return TERRAIN[TERRAIN.length - 1][1];
  }

  // ---------- Game state ----------
  let money = 0;
  let stones = 0;               // stones in your bag
  let inventoryCap = INVENTORY_BASE;
  let progress = 0;             // damage dealt toward the next stone (carries over between stones)
  let punchPower = 1;           // damage per punch
  let hasToughFists = false;
  let openStation = null;       // null, or "shop" when the shop window is open
  let holding = false;          // are you holding the mouse button down on the crusher?
  let sellHold = 0;             // how many seconds you have held it so far
  let ground = [];              // stones lying on the ground; each number is a "slot" next to the rock
  const player = { x: 470, facing: 1, walkPhase: 0, moving: false, punchT: 1 }; // punchT: 0..1 is a punch, 1 = idle
  const keys = {};
  let rockShake = 0;
  const chips = [];             // little rock bits that fly off when punching
  const pops = [];              // floating texts

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const bagCountEl = $("bagCount"), bagCapEl = $("bagCap"), bagFullEl = $("bagFull"), moneyEl = $("money");
  const hintEl = $("hint"), shopPanel = $("shopPanel");
  const buyBtn = $("buyBtn"), leaveBtn = $("leaveBtn");

  // ---------- Colors (switch with the device's light/dark setting) ----------
  const dark = window.matchMedia("(prefers-color-scheme: dark)");
  function colors() {
    return dark.matches
      ? { skyTop: "#141b22", skyLow: "#2b3a45", cloudRGB: "120,140,160", glow: "rgba(150,175,230,0.22)", glow0: "rgba(150,175,230,0)",
          haze: "rgba(20,30,40,0.2)", mist: "rgba(30,45,58,0.55)", mist0: "rgba(30,45,58,0)", snow: "rgba(200,215,235,0.35)",
          farthest: "#3a4956", far: "#33424e", mid: "#2c3b45", near: "#25382f", near2: "#1c2c25", near3: "#30473b",
          earth1: "#5a4533", earth2: "#3a2b1f", strata: "rgba(0,0,0,0.3)", grass: "#47673a", grass2: "#5a7d46", bush1: "#2f4a2c", bush2: "#3e5f39", lichen: "#8e9a4e",
          ink: "#e6e2d6", rock: "#7b8184", rockLight: "#9aa1a4", rockDark: "#4d5457", wood1: "#7a5a3a", wood2: "#58402a", roof1: "#4a3a34", roof2: "#2f2420", brick: "#6e4034",
          steel1: "#5d676e", steel2: "#363d43", accent: "#e0a458" }
      : { skyTop: "#aebdca", skyLow: "#e9eeef", cloudRGB: "255,255,255", glow: "rgba(255,246,220,0.65)", glow0: "rgba(255,246,220,0)",
          haze: "rgba(222,230,236,0.16)", mist: "rgba(226,233,238,0.55)", mist0: "rgba(226,233,238,0)", snow: "rgba(255,255,255,0.88)",
          farthest: "#c4d0da", far: "#aebfcc", mid: "#8ea6b3", near: "#5f8468", near2: "#4a6e55", near3: "#7ea184",
          earth1: "#b98a5f", earth2: "#8d6341", strata: "rgba(90,55,30,0.28)", grass: "#6f9348", grass2: "#8fb257", bush1: "#4f7a3f", bush2: "#6a9650", lichen: "#c2cc72",
          ink: "#2a2d2f", rock: "#8d9396", rockLight: "#b4babd", rockDark: "#5f666a", wood1: "#b98d5c", wood2: "#8f6a40", roof1: "#6b4a3a", roof2: "#4a3228", brick: "#9a5a45",
          steel1: "#7c868d", steel2: "#4f585f", accent: "#b5651d" };
  }

  // ---------- Input ----------
  // Walking uses held keys. Punching and clicking buildings use ONLY mouse clicks.
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (["arrowleft", "arrowright", "a", "d"].includes(k)) { keys[k] = true; e.preventDefault(); }
    if (e.key === "Escape") openStation = null;
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

  const nearRock = () => player.x >= ROCK_X - 100;
  const nearShop = () => Math.abs(player.x - SHOP_X) < 110;
  const nearCrusher = () => Math.abs(player.x - CRUSHER_X) < 80;

  function canvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return { mx: (e.clientX - r.left) * (W / r.width), my: (e.clientY - r.top) * (H / r.height) };
  }
  // Is the mouse over something at world position x that is `halfWidth` wide on each side and `height` tall?
  function over(e, x, halfWidth, height) {
    const { mx, my } = canvasPos(e);
    return Math.abs(mx - x) < halfWidth && my > groundAt(x) - height && my < groundAt(x) + 5;
  }

  canvas.addEventListener("mousemove", e => {
    const clickable = !openStation && ((over(e, ROCK_X, 75, 110) && nearRock()) || (over(e, SHOP_X, 70, 140) && nearShop()) || (over(e, CRUSHER_X, 50, 100) && nearCrusher()));
    canvas.classList.toggle("clickable", clickable);
  });

  canvas.addEventListener("click", e => {
    if (openStation) return;                               // no punching or walking while a window is open
    const tooFar = (x, y) => pops.push({ x, y, life: 1, text: "Walk closer", small: true });
    if (over(e, ROCK_X, 75, 110)) { nearRock() ? punchRock() : tooFar(ROCK_X, groundAt(ROCK_X) - 130); }
    else if (over(e, SHOP_X, 70, 140)) { nearShop() ? openStation = "shop" : tooFar(SHOP_X, groundAt(SHOP_X) - 155); }
  });
  leaveBtn.addEventListener("click", () => { openStation = null; });

  // Hold the left mouse button on the crusher to sell. Releasing, moving off it, or walking away cancels.
  function cancelSell() { holding = false; sellHold = 0; }
  canvas.addEventListener("mousedown", e => {
    if (e.button !== 0 || openStation || !over(e, CRUSHER_X, 50, 100)) return;
    if (!nearCrusher()) { pops.push({ x: CRUSHER_X, y: groundAt(CRUSHER_X) - 130, life: 1, text: "Walk closer", small: true }); return; }
    if (stones === 0) { pops.push({ x: CRUSHER_X, y: groundAt(CRUSHER_X) - 130, life: 1, text: "No stones to sell", small: true }); return; }
    holding = true; sellHold = 0;
  });
  canvas.addEventListener("mousemove", e => { if (holding && !over(e, CRUSHER_X, 50, 100)) cancelSell(); });
  addEventListener("mouseup", cancelSell);

  // ---------- Stones on the ground ----------
  // Each "slot" is a spot next to the rock: slots 0-15 are the first row, 16-31 stack on top, and so on.
  const slotX = slot => ROCK_X - 95 - (slot % 16) * 13;
  const slotRow = slot => Math.floor(slot / 16);

  function dropStone() {
    for (let slot = 0; slot < MAX_GROUND; slot++) {        // find the first empty spot
      if (!ground.includes(slot)) { ground.push(slot); return true; }
    }
    return false;                                          // the ground is completely full, the stone is lost
  }

  // Walking over a stone picks it up, but only if there is room in your bag.
  function pickUpNearbyStones() {
    let picked = 0;
    for (let i = ground.length - 1; i >= 0 && stones < inventoryCap; i--) {
      if (Math.abs(slotX(ground[i]) - player.x) < 20) { ground.splice(i, 1); stones += 1; picked += 1; }
    }
    if (picked > 0) { pops.push({ x: player.x, y: groundAt(player.x) - 100, life: 1, text: "+" + picked, small: true }); saveGame(); }
  }

  // ---------- The core mechanic ----------
  function punchRock() {
    player.facing = 1;
    player.punchT = 0;
    rockShake = 1;
    for (let i = 0; i < 4; i++) chips.push({ x: ROCK_X - 50, y: groundAt(ROCK_X) - 60, vx: -60 - Math.random() * 90, vy: -120 - Math.random() * 80, life: 1 });
    progress += punchPower;
    let bagged = 0, dropped = 0;
    while (progress >= STONE_HEALTH) {                     // a stone breaks off, leftover damage carries over
      progress -= STONE_HEALTH;
      if (stones < inventoryCap) { stones += 1; bagged += 1; }
      else { dropStone(); dropped += 1; }                  // bag is full: the stone falls on the ground
    }
    if (bagged > 0) pops.push({ x: ROCK_X, y: groundAt(ROCK_X) - 130, life: 1, text: bagged === 1 ? "+1 stone" : "+" + bagged + " stones" });
    if (dropped > 0) pops.push({ x: ROCK_X, y: groundAt(ROCK_X) - 152, life: 1, text: "Bag full!", small: true });
    saveGame();
  }

  // ---------- The crusher and the shop ----------
  function sellStones() {
    if (stones === 0) return;
    const earned = stones * STONE_VALUE;
    money += earned;
    stones = 0;
    pops.push({ x: CRUSHER_X, y: groundAt(CRUSHER_X) - 130, life: 1, text: "+$" + earned });
    saveGame();
  }
  function buyToughFists() {
    if (hasToughFists || money < UPGRADE_COST) return;     // already owned, or can't afford it
    money -= UPGRADE_COST;
    hasToughFists = true;
    punchPower = 2;
    saveGame();
  }
  buyBtn.addEventListener("click", buyToughFists);

  // ---------- Update (runs every frame) ----------
  function update(dt) {
    const dir = openStation ? 0 : (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    player.moving = dir !== 0 && player.punchT >= 1;
    if (player.moving) {
      player.x += dir * WALK_SPEED * dt;
      player.facing = dir;
      player.walkPhase += dt * 10;
    }
    player.x = Math.max(30, Math.min(ROCK_X - 60, player.x));
    if (player.punchT < 1) player.punchT = Math.min(1, player.punchT + dt / 0.22);
    rockShake = Math.max(0, rockShake - dt * 6);
    for (const c of chips) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 500 * dt; c.life -= dt * 1.6; }
    for (const p of pops) { p.y -= 40 * dt; p.life -= dt * 1.2; }
    for (const list of [chips, pops]) for (let i = list.length - 1; i >= 0; i--) if (list[i].life <= 0) list.splice(i, 1);

    // Hold-to-sell: the timer runs while the mouse is held, and a sale happens when it fills up.
    if (holding && (!nearCrusher() || openStation)) cancelSell();
    if (holding) {
      sellHold += dt;
      if (sellHold >= SELL_TIME) { sellStones(); cancelSell(); }   // selling resets the hold, so you must click again
    }

    pickUpNearbyStones();

    // Top-of-screen display
    bagCountEl.textContent = stones;
    bagCapEl.textContent = inventoryCap;
    bagFullEl.hidden = stones < inventoryCap;
    moneyEl.textContent = "$" + money;

    // Windows
    shopPanel.hidden = openStation !== "shop";
    leaveBtn.hidden = !openStation;
    buyBtn.disabled = hasToughFists || money < UPGRADE_COST;
    buyBtn.textContent = hasToughFists ? "Owned" : money < UPGRADE_COST ? `Need $${UPGRADE_COST}` : `Buy for $${UPGRADE_COST}`;

    const left = STONE_HEALTH - progress;
    hintEl.textContent = openStation === "shop" ? "Browsing the shop"
      : nearRock() ? (stones >= inventoryCap ? "Bag full: new stones drop on the ground" : `Punch power ${punchPower}: ${left} more damage for the next stone`)
      : nearCrusher() ? (stones > 0 ? "Hold click on the crusher to sell your stones" : "Mine some stones to sell here")
      : nearShop() ? "Click the shop to go in"
      : "Walk with A / D or the arrow keys";
  }

  // ---------- Drawing ----------
  // The canvas is drawn at 2x detail (S) so it stays sharp when stretched across a big screen.
  // Everything below still uses the normal 1000 x 500 game coordinates.
  const W = 1000, H = 500, S = 2;
  canvas.width = W * S; canvas.height = H * S; ctx.scale(S, S);

  // A tiny seeded random number generator: the same seed always gives the same "random" scenery.
  function rng(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const FARTHEST = [[0,120],[60,80],[130,110],[200,60],[280,105],[350,75],[430,115],[510,70],[600,110],[680,55],[760,100],[850,65],[930,105],[1000,80]];
  const FAR  = [[0,150],[70,110],[140,135],[210,95],[300,130],[390,105],[480,140],[570,112],[660,145],[750,105],[840,135],[930,100],[1000,125]];
  const MID  = [[0,190],[90,150],[170,175],[260,140],[360,180],[450,160],[540,185],[640,150],[740,178],[840,150],[930,172],[1000,160]];
  const NEAR = [[0,250],[110,215],[230,240],[350,215],[470,238],[580,185],[660,205],[740,165],[830,200],[920,160],[1000,185]];
  let bg = null, bgIsDark = null;

  function lineY(pts, x) {                                 // height of a mountain line at position x
    for (let i = 0; i < pts.length - 1; i++) {
      if (x <= pts[i + 1][0]) { const t = (x - pts[i][0]) / (pts[i + 1][0] - pts[i][0]); return pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t; }
    }
    return pts[pts.length - 1][1];
  }
  function jag(pts, amp, seed) {                           // roughen a straight mountain line into a craggy one
    const r = rng(seed), out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      out.push([x0, y0]);
      for (let k = 1; k < 6; k++) { const t = k / 6; out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t + (r() - 0.5) * amp]); }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  function buildBackground(c) {
    bg = document.createElement("canvas"); bg.width = W * S; bg.height = H * S;
    const g = bg.getContext("2d"); g.scale(S, S);
    let gr = g.createLinearGradient(0, 0, 0, 300);          // sky, with a glow from the sun (or moon)
    gr.addColorStop(0, c.skyTop); gr.addColorStop(1, c.skyLow);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    gr = g.createRadialGradient(230, 70, 0, 230, 70, 380);
    gr.addColorStop(0, c.glow); gr.addColorStop(1, c.glow0);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    for (const [cx, cy, sc] of [[150, 55, 1], [470, 40, 1.2], [760, 70, 1], [960, 35, 0.8]]) {   // soft clouds made of overlapping puffs
      for (const [dx, dy, rx, ry] of [[-60, 6, 40, 14], [-20, -4, 48, 20], [30, 0, 52, 18], [70, 8, 38, 13], [0, 10, 70, 12]]) {
        g.save(); g.translate(cx + dx * sc, cy + dy); g.scale(1, ry / rx);
        const rg = g.createRadialGradient(0, 0, 0, 0, 0, rx * sc);
        rg.addColorStop(0, `rgba(${c.cloudRGB},0.65)`); rg.addColorStop(1, `rgba(${c.cloudRGB},0)`);
        g.fillStyle = rg; g.fillRect(-rx * sc, -rx * sc, 2 * rx * sc, 2 * rx * sc); g.restore();
      }
    }
    // A mountain range: craggy outline, light and shadow faces on each slope, and mist at the bottom.
    const ridge = (orig, color, seed, mistAmt = 1) => {
      const pts = jag(orig, 9, seed), top = Math.min(...orig.map(q => q[1]));
      g.save(); g.beginPath(); g.moveTo(0, H); pts.forEach(([x, y]) => g.lineTo(x, y)); g.lineTo(W, H); g.closePath();
      g.fillStyle = color; g.fill(); g.clip();
      for (let i = 0; i < orig.length - 1; i++) {
        const [x0, y0] = orig[i], [x1, y1] = orig[i + 1];
        g.beginPath();
        if (y1 > y0) { g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineTo(x0 + (x1 - x0) * 0.4, y1 + 40); g.fillStyle = "rgba(0,0,0,0.13)"; }       // slope facing away from the light
        else { g.moveTo(x1, y1); g.lineTo(x0, y0); g.lineTo(x1 - (x1 - x0) * 0.4, y0 + 40); g.fillStyle = "rgba(255,255,255,0.08)"; }      // slope facing the light
        g.closePath(); g.fill();
      }
      gr = g.createLinearGradient(0, top, 0, top + 170);
      gr.addColorStop(0, c.mist0); gr.addColorStop(1, c.mist);
      g.globalAlpha = mistAmt; g.fillStyle = gr; g.fillRect(0, top, W, H); g.globalAlpha = 1;
      g.restore();
    };
    const snow = orig => {                                   // snow caps on the tallest peaks
      for (let i = 1; i < orig.length - 1; i++) {
        const P = orig[i], L = orig[i - 1], R = orig[i + 1];
        if (P[1] > 95 || P[1] > L[1] || P[1] > R[1]) continue;
        const pl = [P[0] + (L[0] - P[0]) * 0.17, P[1] + (L[1] - P[1]) * 0.17], pr = [P[0] + (R[0] - P[0]) * 0.17, P[1] + (R[1] - P[1]) * 0.17];
        g.fillStyle = c.snow; g.beginPath();
        [pl, P, pr, [(P[0] + pr[0]) / 2 + 2, pr[1] + 9], [P[0], P[1] + 14], [(P[0] + pl[0]) / 2 - 2, pl[1] + 9]].forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y));
        g.closePath(); g.fill();
      }
    };
    ridge(FARTHEST, c.farthest, 1); snow(FARTHEST); g.fillStyle = c.haze; g.fillRect(0, 0, W, H);
    ridge(FAR, c.far, 2);           g.fillStyle = c.haze; g.fillRect(0, 0, W, H);
    ridge(MID, c.mid, 3);           g.fillStyle = c.haze; g.fillRect(0, 0, W, H);
    ridge(NEAR, c.near, 4, 0.25);
    let r = rng(7);                                          // forest and grass texture on the nearest hills
    for (let i = 0; i < 3200; i++) {
      const x = r() * W, y0 = lineY(NEAR, x) + 4, y = y0 + r() * (groundAt(x) - y0);
      if (y < y0 || y > groundAt(x)) continue;
      g.fillStyle = r() < 0.5 ? c.near2 : c.near3; g.globalAlpha = 0.18 + r() * 0.22;
      g.beginPath(); g.ellipse(x, y, 1.5 + r() * 3, 1 + r() * 1.6, 0, 0, Math.PI * 2); g.fill();
    }
    g.globalAlpha = 1;

    // The front of the mountain: soil with layers and pebbles, then grass on top
    const trace = off => { for (let x = 0; x <= W; x += 4) g.lineTo(x, groundAt(x) + off); };
    gr = g.createLinearGradient(0, 230, 0, H); gr.addColorStop(0, c.earth1); gr.addColorStop(1, c.earth2);
    g.fillStyle = gr; g.beginPath(); g.moveTo(0, H); trace(0); g.lineTo(W, H); g.closePath(); g.fill();
    g.strokeStyle = c.strata; g.lineJoin = "round";
    for (const [off, w] of [[16, 2], [38, 3], [70, 4]]) { g.lineWidth = w; g.beginPath(); g.moveTo(0, groundAt(0) + off); trace(off); g.stroke(); }
    r = rng(11);
    for (let i = 0; i < 160; i++) {
      const x = r() * W, y = groundAt(x) + 8 + r() * 120;
      if (y > H - 3) continue;
      g.fillStyle = r() < 0.5 ? "rgba(0,0,0,0.16)" : "rgba(255,255,255,0.13)";
      g.beginPath(); g.ellipse(x, y, 2 + r() * 4, 1.5 + r() * 2, 0, 0, Math.PI * 2); g.fill();
    }
    g.strokeStyle = c.grass; g.lineWidth = 8; g.beginPath(); g.moveTo(0, groundAt(0)); trace(0); g.stroke();
    r = rng(21);
    for (let x = 0; x < W; x += 3) {                         // blades of grass
      const y = groundAt(x), h = 4 + r() * 9, lean = (r() - 0.5) * 6;
      g.strokeStyle = r() < 0.5 ? c.grass : c.grass2; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x, y + 2); g.lineTo(x + lean, y - h); g.stroke();
    }
    for (let i = 0; i < 28; i++) {                           // tiny wildflowers
      const x = r() * W, y = groundAt(x) - 6 - r() * 6;
      g.fillStyle = r() < 0.5 ? "#f4f0e0" : "#e8c64a"; g.beginPath(); g.arc(x, y, 1.8, 0, Math.PI * 2); g.fill();
    }
    for (const [x, rx, ry] of [[75, 14, 8], [385, 11, 6], [190, 9, 5]]) {   // rocks half-buried in the ground, with lichen
      const y = groundAt(x) + 2;
      gr = g.createLinearGradient(x - rx, y - ry, x + rx, y); gr.addColorStop(0, c.rockLight); gr.addColorStop(1, c.rockDark);
      g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rx, ry, 0, Math.PI, 0); g.closePath(); g.fill();
      g.fillStyle = c.lichen; g.globalAlpha = 0.75; g.beginPath(); g.ellipse(x - rx * 0.3, y - ry * 0.6, rx * 0.3, ry * 0.2, 0.3, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    }
    for (const x of [45, 420, 760]) {                        // bushes
      const y = groundAt(x);
      for (const [dx, dy, rr, col] of [[-16, -5, 10, c.bush1], [2, -9, 13, c.bush1], [18, -5, 10, c.bush1], [-6, -10, 9, c.bush2], [10, -13, 8, c.bush2]]) {
        g.fillStyle = col; g.beginPath(); g.arc(x + dx, y + dy, rr, 0, Math.PI * 2); g.fill();
      }
    }
    gr = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.15);   // soft dark edges (vignette)
    gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.28)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }

  // ---- The character: a person in a red shirt, blue denim overalls and boots ----
  function drawPlayer() {
    const x = player.x, f = player.facing, G = groundAt(x);
    const SKIN = "#e2b18a", HAIR = "#4a3426", SHIRT = "#c24d3d", DENIM = "#3a6bb5", DENIM_D = "#2b4f8a", BOOT = "#4a3322";
    const sw = player.moving ? Math.sin(player.walkPhase) * 11 : 0;                      // how far the legs swing
    const lift = side => player.moving ? Math.max(0, side * Math.cos(player.walkPhase)) * 4 : 0;   // feet lift as they step
    const shoulderY = G - 60;
    const limb = (x0, y0, x1, y1, w, col) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
    const arm = (sx, sy, hx, hy, fist) => {                                              // shoulder -> elbow -> hand
      const ex = (sx + hx) / 2 - f * 2, ey = (sy + hy) / 2 + 4;
      ctx.strokeStyle = SHIRT; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(hx, hy, fist ? 5 : 4, 0, Math.PI * 2); ctx.fill();
    };
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(x, G + 1, 17, 4, 0, 0, Math.PI * 2); ctx.fill();   // shadow on the ground

    arm(x - f * 7, shoulderY + 3, x - f * 9 + sw * f * 0.5, shoulderY + 27, false);       // back arm

    const feet = [[x - 4 + sw, G - lift(1)], [x + 4 - sw, G - lift(-1)]];                  // legs (blue pants) and boots
    feet.forEach(([fx, fy], i) => limb(x + (i ? 4 : -4), G - 34, fx, fy - 3, 8, DENIM_D));
    ctx.fillStyle = BOOT; feet.forEach(([fx, fy]) => { ctx.beginPath(); ctx.ellipse(fx + f * 3, fy - 2, 7, 4, 0, 0, Math.PI * 2); ctx.fill(); });

    ctx.fillStyle = SHIRT; ctx.beginPath(); ctx.roundRect(x - 9, shoulderY - 2, 18, 30, 4); ctx.fill();   // shirt
    ctx.fillStyle = DENIM_D; ctx.fillRect(x - 9, G - 40, 18, 9);                           // overalls: waist and pants
    ctx.fillStyle = DENIM; ctx.fillRect(x - 7, G - 56, 14, 17);                            // overalls: bib
    limb(x - 6, shoulderY - 1, x - 5, G - 55, 3.5, DENIM); limb(x + 6, shoulderY - 1, x + 5, G - 55, 3.5, DENIM);   // straps
    ctx.strokeStyle = DENIM_D; ctx.lineWidth = 1.2; ctx.strokeRect(x - 4, G - 51, 8, 6);   // pocket
    ctx.fillStyle = "#e8c25a"; [-6, 6].forEach(bx => { ctx.beginPath(); ctx.arc(x + bx, G - 55, 1.7, 0, Math.PI * 2); ctx.fill(); });   // buttons

    ctx.fillStyle = SKIN; ctx.fillRect(x - 3, G - 67, 6, 7);                               // neck
    ctx.beginPath(); ctx.arc(x, G - 77, 10, 0, Math.PI * 2); ctx.fill();                   // head
    ctx.fillStyle = HAIR; ctx.beginPath(); ctx.arc(x, G - 78, 10.5, Math.PI, 0); ctx.closePath(); ctx.fill();   // hair
    ctx.beginPath(); ctx.ellipse(x - f * 7, G - 76, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#d29a74"; ctx.beginPath(); ctx.arc(x + f * 10, G - 75, 2, 0, Math.PI * 2); ctx.fill();   // nose
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(x + f * 4.5, G - 77, 1.6, 0, Math.PI * 2); ctx.fill();   // eye
    limb(x + f * 3, G - 70, x + f * 7, G - 70, 1.3, "#8a4b3a");                            // mouth

    if (player.punchT < 1) { const reach = Math.sin(Math.PI * player.punchT); arm(x + f * 7, shoulderY + 3, x + f * (16 + reach * 26), shoulderY + 9, true); }
    else arm(x + f * 7, shoulderY + 3, x + f * 9 - sw * f * 0.5, shoulderY + 27, false);   // front arm
  }

  // ---- The rock: faceted grey stone with cracks, layers, lichen and moss ----
  function drawRock(c) {
    const shake = Math.sin(performance.now() / 18) * 4 * rockShake;
    ctx.save(); ctx.translate(ROCK_X, groundAt(ROCK_X));
    ctx.fillStyle = "rgba(0,0,0,0.26)"; ctx.beginPath(); ctx.ellipse(6, 2, 92, 9, 0, 0, Math.PI * 2); ctx.fill();   // shadow (does not shake)
    ctx.translate(shake, 0);
    const poly = (pts, fill) => { ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
    const body = [[-72, 0], [-80, -40], [-60, -70], [-30, -100], [20, -112], [55, -90], [62, -50], [85, -34], [78, 0]];
    const gr = ctx.createLinearGradient(-60, -110, 80, 0); gr.addColorStop(0, c.rockLight); gr.addColorStop(0.5, c.rock); gr.addColorStop(1, c.rockDark);
    poly(body, gr);
    poly([[-30, -100], [20, -112], [55, -90], [30, -74], [-18, -80], [-52, -66]], "rgba(255,255,255,0.22)");     // top faces catch the light
    poly([[-60, -70], [-52, -66], [-18, -80], [-8, -40], [-72, -30], [-80, -40]], "rgba(255,255,255,0.07)");
    poly([[-8, -40], [-18, -80], [30, -74], [38, -60], [44, 0], [-6, 0]], "rgba(0,0,0,0.10)");
    poly([[78, 0], [85, -34], [62, -50], [55, -90], [38, -60], [44, 0]], "rgba(0,0,0,0.28)");                      // shadow side
    ctx.strokeStyle = c.rockDark; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = 1.6; ctx.beginPath();                                                                           // cracks
    ctx.moveTo(-20, -80); ctx.lineTo(-14, -55); ctx.lineTo(-22, -30); ctx.lineTo(-16, -8);
    ctx.moveTo(25, -70); ctx.lineTo(18, -45); ctx.lineTo(26, -20); ctx.stroke();
    ctx.globalAlpha = 0.55; ctx.lineWidth = 2; ctx.beginPath();                                                     // layers in the stone
    ctx.moveTo(-78, -30); ctx.lineTo(55, -44); ctx.moveTo(-64, -58); ctx.lineTo(30, -66); ctx.moveTo(-70, -12); ctx.lineTo(60, -22); ctx.stroke();
    ctx.globalAlpha = 1;
    for (const [lx, ly, rx, ry, col, a] of [[-35, -86, 11, 5, c.lichen, .85], [12, -62, 8, 4, c.lichen, .85], [-55, -34, 9, 5, c.lichen, .8], [40, -80, 6, 4, c.lichen, .8],
                                          [-8, -92, 7, 3, "#e6ebdc", .55], [30, -48, 9, 4, "#e6ebdc", .45], [-45, -58, 6, 3, "#e6ebdc", .5]]) {   // lichen
      ctx.fillStyle = col; ctx.globalAlpha = a; ctx.beginPath(); ctx.ellipse(lx, ly, rx, ry, 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = c.bush2; ctx.globalAlpha = 0.85;                                                                // moss at the base
    for (const mx of [-62, -38, -12, 18, 48, 70]) { ctx.beginPath(); ctx.ellipse(mx, -2, 13, 5, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.restore();
    for (const [px, py, pr] of [[97, 0, 5], [108, 1, 3.5], [92, 1, 3]]) {                                           // loose pebbles beside the rock
      const y = groundAt(ROCK_X + px) - 2; ctx.fillStyle = c.rock; ctx.strokeStyle = c.rockDark; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(ROCK_X + px, y, pr, pr * 0.7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }

  // ---- The shop: a wooden cabin with a shingle roof, striped awning, window and a barrel ----

    ctx.fillStyle = "#f1deb4"; ctx.font = "800 14px Bitter, Georgia, serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("SHOP", 0, -114); ctx.textBaseline = "alphabetic";
    rect(-42, -60, 34, 52, c.roof2); rect(-40, -58, 30, 50, "#6a4a30");                                     // door

    ctx.fillStyle = "#e0c070"; ctx.beginPath(); ctx.arc(-14, -33, 2, 0, Math.PI * 2); ctx.fill();
    rect(8, -62, 34, 30, c.roof2);                                                                          // window

    ctx.strokeStyle = c.roof2; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(25, -60); ctx.lineTo(25, -34); ctx.moveTo(10, -47); ctx.lineTo(40, -47); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.beginPath(); ctx.moveTo(12, -60); ctx.lineTo(20, -60); ctx.lineTo(12, -44); ctx.closePath(); ctx.fill();
    rect(0, -62, 8, 30, "#4f6f58"); rect(42, -62, 8, 30, "#4f6f58");                                        // shutters
    for (let i = 0; i < 10; i++) {                                                                          // striped awning
      const ax = -52 + i * 10.4, col = i % 2 ? "#f0e6d0" : "#c9473a";
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(ax, -72); ctx.lineTo(ax + 10.4, -72); ctx.lineTo(ax + 11.4, -63); ctx.lineTo(ax - 1, -63); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(ax + 5.2, -63, 5.7, 0, Math.PI); ctx.fill();

    ctx.strokeRect(-77, -19, 19, 19); ctx.beginPath(); ctx.moveTo(-77, -19); ctx.lineTo(-58, 0); ctx.moveTo(-58, -19); ctx.lineTo(-77, 0); ctx.stroke();

    rect(58, -28, 18, 28, gr); ctx.fillStyle = "#c9a36e"; ctx.beginPath(); ctx.ellipse(67, -28, 9, 3, 0, 0, Math.PI * 2); ctx.fill();   // barrel

  // ---- The crusher: a steel machine with a hopper, a brass gear that spins while selling, a gauge and a warning light ----
  function drawCrusher(c) {
    const G = groundAt(CRUSHER_X), t = performance.now();
    ctx.save(); ctx.translate(CRUSHER_X + (holding ? Math.sin(t / 25) * 1.2 : 0), G);       // it shakes while crushing
    const rect = (x, y, w, h, fill) => { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); };
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(8, 2, 74, 7, 0, 0, Math.PI * 2); ctx.fill();
    rect(-50, -10, 100, 10, c.steel2);                                                                      // base
    let gr = ctx.createLinearGradient(-45, 0, 45, 0); gr.addColorStop(0, c.steel1); gr.addColorStop(1, c.steel2);
    rect(-45, -64, 90, 54, gr);                                                                             // body
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (const px of [-39, -13, 13, 39]) for (const py of [-58, -16]) { ctx.beginPath(); ctx.arc(px, py, 1.6, 0, Math.PI * 2); ctx.fill(); }   // rivets
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-20, -64); ctx.lineTo(-20, -10); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(-45, -18, 90, 8); ctx.clip();                                     // yellow and black warning stripes
    rect(-45, -18, 90, 8, "#e0b422"); ctx.strokeStyle = "#1e2124"; ctx.lineWidth = 5;
    for (let px = -52; px < 50; px += 12) { ctx.beginPath(); ctx.moveTo(px, -10); ctx.lineTo(px + 8, -18); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.translate(12, -38); ctx.rotate(holding ? t / 110 : 0);                                  // gear
    ctx.beginPath();
    for (let i = 0; i < 20; i++) { const ang = i * Math.PI / 10, rad = i % 2 ? 13 : 18; ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad); }
    ctx.closePath(); ctx.fillStyle = "#b8902a"; ctx.fill(); ctx.strokeStyle = "#6b4f12"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#3a3f44"; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#e8ecee"; ctx.strokeStyle = "#2a2d2f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-30, -46, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();   // gauge
    const needle = holding ? -0.5 + Math.min(1, sellHold / SELL_TIME) * 2.2 : -0.9;
    ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-30, -46); ctx.lineTo(-30 + Math.cos(needle) * 6, -46 + Math.sin(needle) * 6); ctx.stroke();
    ctx.fillStyle = holding ? (Math.floor(t / 150) % 2 ? "#ff5a4a" : "#8a2a22") : "#4caf50";                // warning light
    ctx.beginPath(); ctx.arc(-30, -27, 3.5, 0, Math.PI * 2); ctx.fill();
    gr = ctx.createLinearGradient(-45, 0, 45, 0); gr.addColorStop(0, c.steel1); gr.addColorStop(1, c.steel2);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(-46, -64); ctx.lineTo(46, -64); ctx.lineTo(28, -98); ctx.lineTo(-28, -98); ctx.closePath(); ctx.fill();   // hopper
    ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.moveTo(0, -64); ctx.lineTo(46, -64); ctx.lineTo(28, -98); ctx.lineTo(0, -98); ctx.closePath(); ctx.fill();
    rect(-31, -101, 62, 5, c.steel1);
    ctx.fillStyle = c.rock; ctx.strokeStyle = c.rockDark; ctx.lineWidth = 1.2;
    for (const [px, py] of [[-14, -103], [2, -105], [16, -102]]) { ctx.beginPath(); ctx.ellipse(px, py, 7, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }   // stones in the hopper
    ctx.fillStyle = c.steel2; ctx.beginPath(); ctx.moveTo(45, -34); ctx.lineTo(64, -14); ctx.lineTo(64, -6); ctx.lineTo(45, -22); ctx.closePath(); ctx.fill();   // output chute
    ctx.fillStyle = c.rock; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(58 + k * 4.5, -2 - (k % 2) * 3, 4, 3, 0, 0, Math.PI * 2); ctx.fill(); }   // gravel pile
    ctx.fillStyle = c.ink; ctx.font = "800 13px Bitter, Georgia, serif"; ctx.textAlign = "center"; ctx.fillText("CRUSHER", 0, -108);
    ctx.restore();
  }

  function drawGroundStones(c) {
    const shape = [[-7, 0], [-5, -5], [1, -6], [6, -3], [7, 1], [3, 4], [-4, 3]];            // a lumpy stone
    for (const slot of ground) {
      const x = slotX(slot), y = groundAt(x) - 5 - slotRow(slot) * 9, sc = 0.9 + (slot % 3) * 0.1;
      ctx.beginPath(); shape.forEach(([px, py], i) => i ? ctx.lineTo(x + px * sc, y + py * sc) : ctx.moveTo(x + px * sc, y + py * sc)); ctx.closePath();
      ctx.fillStyle = c.rock; ctx.fill(); ctx.strokeStyle = c.rockDark; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.beginPath(); ctx.ellipse(x - 1 * sc, y - 3 * sc, 3 * sc, 1.5 * sc, -0.3, 0, Math.PI * 2); ctx.fill();   // highlight
    }
  }

  function draw() {
    const c = colors();
    if (!bg || bgIsDark !== dark.matches) { bgIsDark = dark.matches; buildBackground(c); }   // rebuild only if light/dark changed
    ctx.drawImage(bg, 0, 0, W, H);
    drawShop(c); drawCrusher(c); drawRock(c); drawGroundStones(c); drawPlayer();
    ctx.fillStyle = c.rock;
    for (const ch of chips) { ctx.globalAlpha = Math.max(0, ch.life); ctx.fillRect(ch.x, ch.y, 5, 5); }
    ctx.textAlign = "center";
    for (const p of pops) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = c.accent; ctx.font = `800 ${p.small ? 16 : 24}px Bitter, Georgia, serif`; ctx.fillText(p.text, p.x, p.y); }
    ctx.globalAlpha = 1;
    if (holding) {                                         // selling progress bar above the crusher
      const w = 90, x0 = CRUSHER_X - w / 2, y0 = groundAt(CRUSHER_X) - 130;
      ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(x0, y0, w, 9);
      ctx.fillStyle = c.accent; ctx.fillRect(x0, y0, w * Math.min(1, sellHold / SELL_TIME), 9);
      ctx.strokeStyle = "#f4f0e6"; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, w, 9);
    }
    if (nearRock()) {                                      // damage-progress dots above the rock
      for (let i = 0; i < STONE_HEALTH; i++) {
        ctx.beginPath(); ctx.arc(ROCK_X + (i - (STONE_HEALTH - 1) / 2) * 20, groundAt(ROCK_X) - 134, 6, 0, Math.PI * 2);
        ctx.fillStyle = i < progress ? c.accent : "rgba(0,0,0,0.4)"; ctx.fill();
        ctx.strokeStyle = "#f4f0e6"; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
  }

  // ---------- Saving and loading ----------
  const SAVE_KEY = "rockPuncherSave";

  function saveGame() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ money, stones, progress, hasToughFists, ground })); } catch (err) {}
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      const whole = n => Math.max(0, Math.floor(Number(n) || 0));
      hasToughFists = d.hasToughFists === true;
      punchPower = hasToughFists ? 2 : 1;
      progress = Math.min(STONE_HEALTH - 1, whole(d.progress));
      if (d.money === undefined) { money = whole(d.stones); stones = 0; }   // old (v3) save: stones used to be the money
      else { money = whole(d.money); stones = Math.min(inventoryCap, whole(d.stones)); }
      ground = Array.isArray(d.ground) ? [...new Set(d.ground.map(Number))].filter(n => Number.isInteger(n) && n >= 0 && n < MAX_GROUND) : [];
    } catch (err) {}
  }

  $("resetBtn").addEventListener("click", () => {
    if (!confirm("Erase all progress and start over?")) return;
    money = 0; stones = 0; progress = 0; hasToughFists = false; punchPower = 1; ground = []; openStation = null;
    try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
  });

  loadGame();

  // ---------- Game loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
